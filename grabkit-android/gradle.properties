org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- GrabKit build switches -------------------------------------------------------------
# ffmpeg-kit was retired by its author (April 2025) and com.arthenica:ffmpeg-kit-* no longer
# resolves on clean builds. This is a community fork with the same com.arthenica.ffmpegkit API.
# Swap the coordinate here if you use a different fork or a self-built AAR.
grabkit.ffmpeg=dev.ffmpegkit-maintained:ffmpeg:6.0.3
# ABIs to package. The fork above publishes arm64-v8a only. Add x86_64 for emulators only if
# your ffmpeg build ships it, otherwise the app crashes when FFmpeg loads.
grabkit.abis=arm64-v8a
